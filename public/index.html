<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .repo-link {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            z-index: 10;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="caret-color: transparent;">
    <canvas id="canvas"></canvas>

    <p class="repo-link">
        <a href="https://github.com/ivan-enzhaev/textured-y-bot-cgltf-cglm-sdl3-image-webp-opengl-sdl3-cpp" target="_blank" rel="noopener noreferrer" style="color: white;">GitHub repository</a>
    </p>

    <script>
        const canvas = document.getElementById("canvas");
        canvas.oncontextmenu = event => { event.preventDefault(); return false; };
    </script>
    <script async src="./js/app.js"></script>
</body>

</html>
